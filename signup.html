<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign up • Urban Mining Connect</title><link rel="stylesheet" href="style.css"></head><body><main class="auth-page"><div class="auth-card"><a class="brand auth-brand" href="index.html"><span class="brandmark">♻</span><span>Urban Mining Connect</span></a><div class="eyebrow">CREATE ACCOUNT</div><h1 class="title">Join the recovery network.</h1><p class="subtitle">Create a Collector account to capture materials, or a Buyer account to manage incoming lots.</p><div class="role-grid"><button id="collectorRole" class="role-card selected" onclick="chooseRole('collector')">🚚<b>Collector</b><small>Capture, value and hand over lots</small></button><button id="buyerRole" class="role-card" onclick="chooseRole('buyer')">♻️<b>Buyer / Recycler</b><small>Review incoming lots and manage recovery</small></button></div><form id="form"><div class="field"><label>Full name / organization</label><input id="name" required placeholder="Your name or business name"></div><div class="grid g2"><div class="field"><label>Email</label><input id="email" type="email" required placeholder="you@example.com"></div><div class="field"><label>Phone</label><input id="phone" inputmode="tel" placeholder="Optional"></div></div><div class="field"><label>Password</label><input id="password" type="password" minlength="6" required placeholder="At least 6 characters"></div><button class="btn btn-primary" style="width:100%;margin-top:8px">Create account</button><div id="msg" class="notice" style="display:none;margin-top:15px"></div></form><p class="small muted" style="text-align:center;margin-top:18px">Already registered? <a href="login.html">Log in</a></p></div></main><script src="config.js"></script><script src="app.js"></script><script>let role='collector';function chooseRole(r){role=r;collectorRole.classList.toggle('selected',r==='collector');buyerRole.classList.toggle('selected',r==='buyer')}document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const msgEl=document.getElementById('msg');msgEl.style.display='none';try{await api('/auth/signup',{method:'POST',body:JSON.stringify({name:document.getElementById('name').value,email:document.getElementById('email').value,phone:document.getElementById('phone').value,password:document.getElementById('password').value,role})});location.href=role==='buyer'?'console.html':'index.html'}catch(err){let text='Could not create account';try{text=JSON.parse(err.message).error||text}catch(e){}msgEl.textContent=text;msgEl.style.display='block'}})</script></body></html>
