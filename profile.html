<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile</title><link rel="stylesheet" href="style.css"></head><body><script src="config.js"></script><script src="app.js"></script><script>requireAuth('collector');</script><script>shell("Home")</script><main class="page fade"><div class="eyebrow">COLLECTOR PROFILE</div><h1 class="title">Simple identity, more trust.</h1><p class="subtitle">Minimal profile fields support traceability without making onboarding heavy.</p><section class="card"><div class="grid g2"><div class="field"><label>Name</label><input value="Collector Demo"></div><div class="field"><label>Collector ID</label><input value="COL-1048" readonly></div><div class="field"><label>Preferred language</label><select><option>Hindi</option><option>Marathi</option></select></div><div class="field"><label>Sync mode</label><input value="Offline-first enabled" readonly></div></div><div class="actions"><button class="btn btn-primary" onclick="saveProfile()">✓ Save profile</button></div></section></main><script>async function saveProfile(){const inputs=document.querySelectorAll('input');const lang=document.querySelector('select').value;try{await api('/profile',{method:'PUT',body:JSON.stringify({name:inputs[0].value,preferred_language:lang})});state.lang=lang;localStorage.setItem('um_lang',lang);speak('प्रोफाइल सेव हो गई है')}catch(e){speak('प्रोफाइल लोकली सेव हुई है')}}api('/profile').then(p=>{document.querySelectorAll('input')[0].value=p.name;document.querySelector('select').value=p.preferred_language||state.lang}).catch(()=>{});footer()</script></body></html>
