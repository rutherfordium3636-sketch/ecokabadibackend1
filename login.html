<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login • Urban Mining Connect</title><link rel="stylesheet" href="style.css"></head><body><main class="auth-page"><div class="auth-card"><a class="brand auth-brand" href="index.html"><span class="brandmark">♻</span><span>Urban Mining Connect</span></a><div class="eyebrow">SECURE LOGIN</div><h1 class="title">Welcome back.</h1><p class="subtitle">Log in as a collector or buyer/recycler to continue.</p><form id="form"><div class="field"><label>Email</label><input id="email" type="email" required placeholder="you@example.com"></div><div class="field"><label>Password</label><input id="password" type="password" required placeholder="Your password"></div><button class="btn btn-primary" style="width:100%;margin-top:8px">Log in</button><div id="msg" class="notice" style="display:none;margin-top:15px"></div></form><div class="demo-box"><b>Account types</b><div class="small muted">Collector → capture and traceability workflow</div><div class="small muted">Buyer / Recycler → recovery partner console</div></div><p class="small muted" style="text-align:center;margin-top:18px">New here? <a href="signup.html">Create an account</a></p></div></main><script src="config.js"></script><script src="app.js"></script><script>document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const msgEl=document.getElementById('msg');msgEl.style.display='none';try{const d=await api('/auth/login',{method:'POST',body:JSON.stringify({email:document.getElementById('email').value,password:document.getElementById('password').value})});const next=new URLSearchParams(location.search).get('next');location.href=next || (d.user.role==='admin' ? 'admin.html' : (d.user.role==='buyer' ? 'console.html' : 'index.html'))}catch(err){let text='Invalid email or password';try{text=JSON.parse(err.message).error||text}catch(e){}msgEl.textContent=text;msgEl.style.display='block'}})</script></body></html>
